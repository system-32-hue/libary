    <script>
        if (typeof WebAssembly !== "object" || typeof WebAssembly.instantiate !== "function") {
            document.getElementById('noflash').removeAttribute('style');
        }

        let startGame = function () {
            document.getElementById('game-ruffle').style.removeProperty('display');

            let play = function () {
                let ids = ['gamefile', 'gamefileEmbed'];

                for (let i = 0; i < ids.length; i++) {
                    let embed = document.getElementById(ids[i]);

                    if (embed && typeof embed.play === 'function' && embed.readyState >= 1) {
                        embed.play();
                        return true;
                    }
                }

                return false;
            };

            if (! play()) {
                let poll = setInterval(function () {
                    if (play()) {
                        clearInterval(poll);
                    }
                }, 100);
            }
        };

        (function () {
            let isPurchaseUrl = function (url) {
                let parsed = new URL(url, window.location.href);
                return /(^|\.)armorgames\.com$/.test(parsed.hostname)
                    && /^\/purchase(\/|$)/.test(parsed.pathname);
            };

            let showStorefront = function (sku) {
                if (! sku || ! window._gameId || ! window.agi || ! agi.v2 || ! agi.v2.showPurchaseModal || ! agi.v2.setVendor) {
                    return false;
                }

                agi.v2.setVendor(agi.v2.config.vendorType.WEBSITE);

                agi.v2.showPurchaseModal('/premium-storefront?sku=' + encodeURIComponent(sku) +
                    '&gid=' + encodeURIComponent(window._gameId) + '&type=game&metadata=');
                return true;
            };

            let nativeSubmit = HTMLFormElement.prototype.submit;

            HTMLFormElement.prototype.submit = function () {
                try {
                    let sku = this.querySelector('[name="sku"]');

                    if (isPurchaseUrl(this.action) && showStorefront(sku && sku.value)) {
                        return;
                    }
                } catch (e) {}

                return nativeSubmit.apply(this, arguments);
            };

            let nativeOpen = window.open;

            window.open = function (url) {
                try {
                    if (url && isPurchaseUrl(url)) {
                        let sku = new URL(url, window.location.href).searchParams.get('sku');

                        if (showStorefront(sku)) {
                            return null;
                        }
                    }
                } catch (e) {}

                return nativeOpen.apply(this, arguments);
            };
        })();
    </script>

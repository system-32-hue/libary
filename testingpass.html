
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Senha Especial</title>
<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
    padding: 30px;
}
input {
    padding: 12px;
    width: 300px;
}
iframe {
    width: 95%;
    height: 500px;
    border: none;
    margin-top: 20px;
}
</style>
</head>
<body>

<h2>Digite a senha</h2>

<input id="senha" type="password" placeholder="Senha...">

<button onclick="verificar()">Entrar</button>

<div id="resultado"></div>

<script>
const palavra = "pneumonoultramicroscopicsilicovolcanoconiosis";

function verificar() {
    const senha = document.getElementById("senha").value;

    if (senha === palavra) {
        document.getElementById("resultado").innerHTML =
        '<iframe src="https://example.com"></iframe>';
    } else {
        alert("Senha incorreta!");
    }
}
</script>

</body>
</html>
